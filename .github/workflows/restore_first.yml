name: Restore First Commit
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore exact first commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Eng birinchi commitni topish
          FIRST_COMMIT=$(git rev-list --max-parents=0 HEAD | tail -n 1)
          echo "First commit: $FIRST_COMMIT"
          
          # Hozirgi fayllarni tozalash (workflowlardan tashqari)
          rm -rf index.html style.css app.js REJA.md fetcher.html
          
          # Birinchi commitdagi barcha fayllarni olib kelish
          git checkout $FIRST_COMMIT -- .
          
          # O'zgarishlarni saqlash va yuborish
          git add .
          git commit -m "Restore exact first commit files" || echo "No changes to commit"
          git push origin main
