<!DOCTYPE html>
<html>
<body>
  <div id="content">Loading...</div>
  <script>
    async function load() {
      try {
        const res = await fetch('https://api.github.com/repos/UZBLEADERRR/temur.fit/commits/0d17981');
        const json = await res.json();
        document.getElementById('content').textContent = JSON.stringify(json);
      } catch (e) {
        document.getElementById('content').textContent = 'Error: ' + e.message;
      }
    }
    load();
  </script>
</body>
</html>
